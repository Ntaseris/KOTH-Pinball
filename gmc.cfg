w=["event", "mission_select_bill_mini_wizard_selected"]
h=["event", "mission_select_boom_mini_wizard_selected"]
n=["event", "test_whack_a_mole_mystery_flow"]
1=["event", "gi_keyboard_test_1"]
2=["event", "gi_keyboard_test_2"]
3=["event", "gi_keyboard_test_3"]
4=["event", "gi_keyboard_test_ball_save"]
5=["event", "gi_keyboard_test_4"]
6=["event", "gi_keyboard_test_5"]
7=["event", "gi_keyboard_test_6"]
p=["switch", "s_plunger"]
x=["switch", "s_bottom_inline_drop"]
c=["switch", "s_middle_inline_drop"]
v=["switch", "s_left_spinner"]
b=["switch", "s_center_spinner"]
