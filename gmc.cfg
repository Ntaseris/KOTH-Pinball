[sound_system]

music={
"type": "solo"
}
effects={
"default": true,
"simultaneous_sounds": 3,
"type": "simultaneous"
}
voice={
"type": "sequential"
}
video={
"simultaneous_sounds": 1,
"type": "simultaneous"
}

[keyboard]

q=["switch", "s_right_inlane:"]
