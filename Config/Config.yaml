autofire_coils:
  left_sling:
    coil: c_left_sling
    switch: s_left_sling
  right_sling:
    coil: c_right_sling
    switch: s_right_sling
  pop_1:
    coil: c_right_pop
    switch: s_right_pop_bumper
  pop_2:
    coil: c_left_pop
    switch: s_left_pop_bumper


  
ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5, s_trough6
    tags: trough, home, drain
    eject_coil: c_trough_eject_coil
    eject_timeouts: 1s
    eject_targets: bd_plunger
    auto_fire_on_unexpected_ball: false
  bd_grill_lock:
    entrance_events: grill_virtual_ball_entered
    counter:
      class: koth_code.event_ball_counter.EventBallCounter
      entrance_switch: []
      ball_capacity: 3
      settle_time_ms: 100ms
    eject_targets: playfield
    ejector:
      class: mpf.devices.ball_device.event_ejector.EventEjector
      events_when_eject_try: servo_grill_shelf_down
    eject_all_events: multiball_grill_mb_started, grill_lock_ball_end_release
    confirm_eject_type: fake
    eject_timeouts: 3s
    max_eject_attempts: 3
  bd_plunger:
    ball_switches: s_plunger
    eject_coil: c_auto_plunger
    mechanical_eject: true
    confirm_eject_type: switch
    confirm_eject_switch: s_plunger_lane_exit
    eject_timeouts: 3s
  bd_scoop:
    eject_coil: c_scoop_eject
    ball_switches: s_scoop

