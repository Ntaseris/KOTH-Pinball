    default_hold_power: .5
  c_trough_eject_coil:
    number: 3208-5
    default_pulse_ms: 40
  c_drop_reset:
    number: 3208_upper-6
    default_pulse_power: .9
    default_pulse_ms: 60
  c_scoop_eject:
    number: 3208_upper-7
    default_pulse_ms: 20
  c_auto_plunger:
    number: 3208-7
    default_pulse_ms: 65
  c_left_sling:
    number: 3208-2
    default_pulse_ms: 21
  c_right_sling:
    number: 3208-6
    default_pulse_ms: 20
  c_right_pop:
    number: 3208_upper-4
    default_pulse_ms: 15
  c_left_pop:
    number: 3208_upper-5 
    default_pulse_ms: 15
