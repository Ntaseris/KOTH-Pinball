#config_version=6

custom_code:
  - koth_code.grill_lock_cleanup.GrillLockCleanup

mpf:
  report_crashes: never

hardware:
  platform: fast

machine:
  min_balls: 0
  balls_installed: 4

game:
  balls_per_game: 3
  add_player_switch_tag: add_player

   

fast:
  net:
    controller: neuron
    port: /dev/cu.usbmodem1301
    io_loop: 
      3208_upper:
        model: FP-I/O-3208
        order: 3
      3208:
        model: FP-I/O-3208
        order: 2
      cabinet_board:
        model: FP-I/O-0024
        order: 1
    watchdog: 1s
    baud: 921600
    debug: false
  exp: 
    boards:  
      playfield1:
        model: FP-EXP-0071
      playfield2:
        model: FP-EXP-0081
    port: /dev/cu.usbmodem1303
    baud: 921600
    debug: true
      
    

  
displays:
  window:
    height: 768
    width: 1366
    default: true

light_settings:
  default_color_correction_profile: brighter_inserts
  color_correction_profiles:
    brighter_inserts:
      gamma: 1.5
      whitepoint: [1.0, 1.0, 1.0]
  
playfields:
  playfield:
    default_source_device: bd_plunger
    tags: default

servos:
  servo_grill:
    servo_min: 0.0
    servo_max: 1.0
    positions:
      1.0: servo_grill_open
      0.0: servo_grill_close
    reset_position: 0.0
    reset_events: reset_servo_grill
    number: playfield1-2
  servo_grill_shelf:
    servo_min: 0.0
    servo_max: 1.0
    positions:
      0.1: servo_grill_shelf_up
      0.9: servo_grill_shelf_down
    reset_position: 0.9
    reset_events: reset_servo_grill_shelf
    number: playfield1-1
  servo_spatula:
    servo_min: 0.0
    servo_max: 1.0
    positions:
      0.69: servo_spatula_left
      0.5: servo_spatula_right
    reset_position: 0.69
    reset_events: reset_servo_spatula
    number: playfield1-3

