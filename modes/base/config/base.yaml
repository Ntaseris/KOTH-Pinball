timers:
  strickland_bbq_pop_block:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 6s
    start_running: false
    control_events:
      - event: s_left_rollover_lane_active
        action: restart
      - event: s_middle_rollover_lane_active
        action: restart
      - event: s_right_rollover_lane_active
        action: restart
      - event: ball_will_end
        action: stop
  pf_x_timer:
    start_value: 30
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: logicblock_captive_pf_x_counter_complete
        action: restart
  steak_spinner_stop:
    start_value: 1
    end_value: 0
    direction: down
    tick_interval: 500ms
    start_running: false
    control_events:
      - event: s_left_spinner_active
        action: restart
      - event: s_center_spinner_active
        action: restart
  up_post_raise_duration:
    start_value: 2
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: left_orbit_post_release
        action: restart
      - event: ball_will_end
        action: stop
sequence_shots:
  left_orbit_post_combo:
    switch_sequence:
      - s_left_spinner
      - s_left_orbit_enter
    sequence_timeout: 2s
    cancel_events: ball_will_end, tilt

