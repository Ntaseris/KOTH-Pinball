  slide_base_active{device.shots.qualify_o_target.state_name == "lit"}:
    - restore_qualify_o_widget
  slide_base_active{device.shots.rainey_multiball_ball_lock_p2_target.state_name == "lit"}:
    - restore_rainey_p2_widget
  slide_base_active{device.shots.rainey_multiball_ball_lock_a_target.state_name == "lit"}:
    - restore_rainey_a_widget
  slide_base_active{device.shots.rainey_multiball_ball_lock_n_target.state_name == "lit"}:
    - restore_rainey_n_widget
  slide_base_active{device.shots.rainey_multiball_ball_lock_e_target.state_name == "lit"}:
    - restore_rainey_e_widget
  slide_base_active{current_player.propane_ui_pro_complete == 1}:
    - restore_qualify_p_widget
    - restore_qualify_r_widget
    - restore_qualify_o_widget
  slide_base_active{current_player.propane_ui_pane_complete == 1}:
    - restore_rainey_p2_widget
    - restore_rainey_a_widget
    - restore_rainey_n_widget
    - restore_rainey_e_widget
  player_selected_mission{current_player.mystery_qualified == 1}:
    - restore_mystery_hold

  # Friendly Neighbor behaviour for PRO qualify targets.
  # If a lit target is hit again, award an adjacent unlit target instead.
  qualify_p_target_lit_hit{device.shots.qualify_r_target.state_name == "unlit"}:
    - friendly_neighbor_award_r
  qualify_o_target_lit_hit{device.shots.qualify_r_target.state_name == "unlit"}:
    - friendly_neighbor_award_r
  qualify_r_target_lit_hit{device.shots.qualify_p_target.state_name == "unlit"}:
    - friendly_neighbor_award_p
  qualify_r_target_lit_hit{device.shots.qualify_p_target.state_name != "unlit" and device.shots.qualify_o_target.state_name == "unlit"}:
    - friendly_neighbor_award_o

  # Friendly Neighbor behaviour for PANE lock targets.
  # If a lit target is hit again, award an adjacent unlit target instead.
  rainey_multiball_ball_lock_p2_target_lit_hit{device.shots.rainey_multiball_ball_lock_a_target.state_name == "unlit"}:
    - friendly_neighbor_award_a
  rainey_multiball_ball_lock_a_target_lit_hit{device.shots.rainey_multiball_ball_lock_p2_target.state_name == "unlit"}:
    - friendly_neighbor_award_p2
  rainey_multiball_ball_lock_a_target_lit_hit{device.shots.rainey_multiball_ball_lock_p2_target.state_name != "unlit" and device.shots.rainey_multiball_ball_lock_n_target.state_name == "unlit"}:
    - friendly_neighbor_award_n
  rainey_multiball_ball_lock_n_target_lit_hit{device.shots.rainey_multiball_ball_lock_a_target.state_name == "unlit"}:
    - friendly_neighbor_award_a
  rainey_multiball_ball_lock_n_target_lit_hit{device.shots.rainey_multiball_ball_lock_a_target.state_name != "unlit" and device.shots.rainey_multiball_ball_lock_e_target.state_name == "unlit"}:
    - friendly_neighbor_award_e
  rainey_multiball_ball_lock_e_target_lit_hit{device.shots.rainey_multiball_ball_lock_n_target.state_name == "unlit"}:
    - friendly_neighbor_award_n
 





