shot_groups:
  qualify_mission:
    shots: qualify_p_target, qualify_r_target, qualify_o_target
    restart_events:
      ball_ending: 0s
    disable_events: qualify_mission_lit_complete, mode_base_started{current_player.mission_qualified == 1}, mode_mission_select_started, multiball_strickland_multiball_started, multiball_rainey_multiball_started, multiball_grill_mb_started, mode_wizard_mode_started, mode_beercan_carousel_started, mode_beat_the_surfer_started, mode_beer_can_named_desire_started, mode_bill_bulk_and_the_body_buddies_started, mode_bill_mini_wizard_started, mode_boom_mini_wizard_started, mode_patch_boomhauer_started, mode_dale_mini_wizard_started, mode_dog_dale_afternoon_started, mode_duke_the_dolphin_started, mode_gladstone_started, mode_hank_mini_wizard_started, mode_the_heat_waver_started
    enable_events: stop_mode_skillshot, mode_beercan_carousel_stopped, mode_beat_the_surfer_stopped, mode_beer_can_named_desire_stopped, mode_bill_bulk_and_the_body_buddies_stopped, mode_bill_mini_wizard_stopped, mode_boom_mini_wizard_stopped, mode_patch_boomhauer_stopped, mode_dale_mini_wizard_stopped, mode_dog_dale_afternoon_stopped, mode_duke_the_dolphin_stopped, mode_gladstone_stopped, mode_hank_mini_wizard_stopped, mode_the_heat_waver_stopped, multiball_strickland_multiball_ended{current_player.mode_running == 0}, multiball_rainey_multiball_ended{current_player.mode_running == 0}, multiball_grill_mb_ended{current_player.mode_running == 0}, mode_wizard_mode_stopped
  light_rainey_multiball_ball_lock:
    shots: rainey_multiball_ball_lock_p2_target, rainey_multiball_ball_lock_a_target, rainey_multiball_ball_lock_n_target, rainey_multiball_ball_lock_e_target
