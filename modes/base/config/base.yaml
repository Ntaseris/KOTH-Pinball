      - multiball_rainey_multiball_ended{current_player.rainey_mb_used_this_ball == 0}
    reset_events:
      multiball_rainey_multiball_ended: .5s
    disable_events: mode_base_started{device.achievements.lock_lit.state == "started"}, multiball_strickland_multiball_started, multiball_rainey_multiball_started, multiball_grill_mb_started, light_rainey_multiball_ball_lock_lit_complete
