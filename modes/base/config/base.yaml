    make_your_choice:
      action: remove
  slide_beer_can_named_desire_rules_removed: make_your_choice
  stop_mode_skillshot: base
  mode_bill_bulk_and_the_body_buddies_stopped{current_player.bill_bulk_and_the_body_buddies_completed == 0}:
    bill_bulk_and_the_body_buddies_mode_total:
      expire: 3s
      priority: 9000
  mode_the_heat_waver_stopped{current_player.the_heat_waver_completed == 0}:
    the_heat_waver_mode_total:
      expire: 3s
      priority: 9000
  mode_beat_the_surfer_stopped{current_player.beat_the_surfer_completed == 0}:
    beat_the_surfer_mode_total:
      expire: 3s
      priority: 9000
  mode_dog_dale_afternoon_stopped{current_player.dog_dale_afternoon_completed == 0}:
    dog_dale_afternoon_mode_total:
      expire: 3s
      priority: 9000
  mode_beer_can_named_desire_stopped{current_player.beer_can_named_desire_completed == 0}:
    make_your_choice:
      action: remove
    beer_can_mode_total:
      expire: 3s
      priority: 9000
  shot_beercan_right_ramp_hit:
    beer_can_hank_success:
      expire: 2.5s
      priority: 9100
  dog_dale_afternoon_done:
    dog_dale_afternoon_finish:
      expire: 5.9s
      priority: 9100
  the_heat_waver_done:
    the_heat_waver_finish:
      expire: 5s
      priority: 9100
