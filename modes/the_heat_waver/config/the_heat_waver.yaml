      action: stop
  shot_left_ramp_heat_hit{current_player.shot_color2 >= 35 and device.state_machines.the_heat_waver.state=="shot2"}:
    left_ramp_green:
      action: stop
  shot_left_ramp_heat_hit{current_player.shot_color2 >= 20 and current_player.shot_color2 < 35 and device.state_machines.the_heat_waver.state=="shot2"}:
    left_ramp_yellow:
      action: stop
  shot_left_ramp_heat_hit{current_player.shot_color2 < 20 and device.state_machines.the_heat_waver.state=="shot2"}:
    left_ramp_red:
      action: stop
  timer_shot_timer_shot3_tick{current_player.shot_color3 >= 35}: center_spinner_green
  timer_shot_timer_shot3_tick{current_player.shot_color3 >= 20 and current_player.shot_color3 < 35}: center_spinner_yellow
  timer_shot_timer_shot3_tick{current_player.shot_color3 < 35}: 
    center_spinner_green:
      action: stop
  timer_shot_timer_shot3_tick{current_player.shot_color3 < 20}:
    center_spinner_yellow:
      action: stop
    center_spinner_red:
      action: play
  timer_shot_timer_shot3_tick{current_player.shot_color3 < 1}:  
    center_spinner_red:
      action: stop
  shot_center_spinner_heat_hit{current_player.shot_color3 >= 35 and device.state_machines.the_heat_waver.state=="shot3"}:
    center_spinner_green:
      action: stop
  shot_center_spinner_heat_hit{current_player.shot_color3 >= 20 and current_player.shot_color3 < 35 and device.state_machines.the_heat_waver.state=="shot3"}:
    center_spinner_yellow:
      action: stop
  shot_center_spinner_heat_hit{current_player.shot_color3 < 20 and device.state_machines.the_heat_waver.state=="shot3"}:
    center_spinner_red:
      action: stop
  timer_shot_timer_shot4_tick{current_player.shot_color4 >= 35}: right_ramp_green
  timer_shot_timer_shot4_tick{current_player.shot_color4 >= 20 and current_player.shot_color4 < 35}: right_ramp_yellow
  timer_shot_timer_shot4_tick{current_player.shot_color4 < 35}: 
    right_ramp_green:
      action: stop
  timer_shot_timer_shot4_tick{current_player.shot_color4 < 20}:
    right_ramp_yellow:
      action: stop
    right_ramp_red:
      action: play
  timer_shot_timer_shot4_tick{current_player.shot_color4 < 1}: 
    right_ramp_red:
      action: stop
  shot_right_ramp_heat_hit{current_player.shot_color4 >= 35 and device.state_machines.the_heat_waver.state=="shot4"}:
    right_ramp_green:
      action: stop
  shot_right_ramp_heat_hit{current_player.shot_color4 >= 20 and current_player.shot_color4 < 35 and device.state_machines.the_heat_waver.state=="shot4"}:
    right_ramp_yellow:
      action: stop
  shot_right_ramp_heat_hit{current_player.shot_color4 < 20 and device.state_machines.the_heat_waver.state=="shot4"}:
    right_ramp_red:
      action: stop
  timer_shot_timer_shot5_tick{current_player.shot_color5 >= 35}: right_orbit_green
  timer_shot_timer_shot5_tick{current_player.shot_color5 >= 20 and current_player.shot_color5 < 35}: right_orbit_yellow
