sound_player:
  play_peggy_ho_yeah_boggle_win_alamo:
    peggy_ho_yeah_boggle_win:
      bus: voice
      ducking: {bus: video, attenuation: 0.75, attack: 0.05, release: 0.25, release_point: 0.0}
      max_queue_time: 0
  play_peggy_ho_yeah_boggle_championship_alamo:
    peggy_ho_yeah_boggle_championship:
      bus: voice
      ducking: {bus: video, attenuation: 0.75, attack: 0.05, release: 0.25, release_point: 0.0}
      max_queue_time: 0
  play_peggy_ho_yeah_leanne_fight_alamo:
    peggy_ho_yeah_leanne_fight:
      bus: voice
      ducking: {bus: video, attenuation: 0.75, attack: 0.05, release: 0.25, release_point: 0.0}
      max_queue_time: 0
  mode_alamo_frenzy_started:
    peggy_intro:
      bus: voice
      ducking: {bus: video, attenuation: 0.75, attack: 0.05, release: 0.25, release_point: 0.0}
    opening_beer:
      bus: effects
      volume: 0.45
  logicblock_alamo_frenzy_hit_counter_complete:
    award_chime:
      bus: effects
      volume: 0.34
  timer_alamo_frenzy_mode_countdown_complete:
    success_sting:
      bus: effects
      volume: 0.34
