#config_version=6

mode:
  start_events: player_alamo_target_hits{value == 12 and current_player.any_mb_active == 0}
  stop_events: timer_alamo_frenzy_mode_countdown_complete, ball_ended, multiball_strickland_multiball_started, multiball_rainey_multiball_started, multiball_grill_mb_started
  priority: 500

timers:
  alamo_frenzy_mode_countdown:
    start_value: 15
    end_value: 0
    direction: down
    start_running: true
    bcp: true

slide_player:
  mode_alamo_frenzy_started: 
    alamo_frenzy_slide:
      expire: 1s

variable_player:
  mode_alamo_frenzy_started:
    alamo_frenzy_hits:
      int: 0
      action: set
    alamo_frenzy_total:
      int: 0
      action: set
  alamo_frenzy_scoring_hit:
    alamo_frenzy_hits:
      int: 1
      action: add
    alamo_frenzy_total:
      int: 250000 * current_player.pf_multiplier
      action: add
  s_right_inlane_active:
    score: 100 * current_player.pf_multiplier
  s_p_target_active:
    score: 250000 * current_player.pf_multiplier
  s_r_target_active:
    score: 250000 * current_player.pf_multiplier
  s_o_target_active:
    score: 250000 * current_player.pf_multiplier
  s_p2_target_active:
    score: 250000 * current_player.pf_multiplier
  s_a_target_active:
    score: 250000 * current_player.pf_multiplier
  s_n_target_active:
    score: 250000 * current_player.pf_multiplier
  s_e_target_active:
    score: 250000 * current_player.pf_multiplier
  s_top_inline_drop_active:
    score: 250000 * current_player.pf_multiplier
  s_middle_inline_drop_active:
    score: 250000 * current_player.pf_multiplier
  s_bottom_inline_drop_active:
    score: 250000 * current_player.pf_multiplier
  s_left_ramp_enter_active:
    score: 250000 * current_player.pf_multiplier
  s_right_ramp_enter_active:
    score: 250000 * current_player.pf_multiplier
  s_left_outlane_active:
    score: 100 * current_player.pf_multiplier
    tags: drain
  s_left_inlane_active:
    score: 50 * current_player.pf_multiplier
  s_left_sling_active:
    score: 10 * current_player.pf_multiplier
  s_right_sling_active:
    score: 10 * current_player.pf_multiplier
  s_right_outlane_active:
    score: 100 * current_player.pf_multiplier
    tags: drain
  s_ladybird_target_active:
    score: 250000 * current_player.pf_multiplier
  s_right_ramp_standup_active:
    score: 250000 * current_player.pf_multiplier
  s_left_orbit_enter_active:
    score: 250000 * current_player.pf_multiplier
  s_left_spinner_active:
    score: 250000 * current_player.pf_multiplier
  s_center_spinner_active:
    score: 250000 * current_player.pf_multiplier
  s_left_pop_bumper_active:
    score: 250000 * current_player.pf_multiplier
  s_right_pop_bumper_active:
    score: 250000 * current_player.pf_multiplier
  s_left_rollover_lane_active:
    score: 50 * current_player.pf_multiplier
  s_middle_rollover_lane_active:
    score: 50 * current_player.pf_multiplier
  s_right_rollover_lane_active:
    score: 50 * current_player.pf_multiplier
  s_right_orbit_exit_active:
    score: 250000 * current_player.pf_multiplier
  s_left_inner_horseshoe_active:
    score: 250000 * current_player.pf_multiplier
  # s_right_inner_horseshoe_active:
  #   score: 100 * current_player.pf_multiplier

widget_player:  
  widget_alamo_can_widget3_active:
    alamo_can_widget3:
      expire: 1s
  widget_alamo_can_widget2_active:
    alamo_can_widget2:
      expire: 1s
  widget_alamo_can_widget_active:
    alamo_can_widget:
      expire: 1s
  widget_alamo_can_widget4_active:
    alamo_can_widget4:
      expire: 1s
  widget_alamo_can_widget5_active:
    alamo_can_widget5:
