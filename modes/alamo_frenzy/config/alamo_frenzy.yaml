  s_bottom_inline_drop_active: alamo_frenzy_scoring_hit
  s_left_ramp_enter_active: alamo_frenzy_scoring_hit
  s_right_ramp_enter_active: alamo_frenzy_scoring_hit
  s_ladybird_target_active: alamo_frenzy_scoring_hit
  s_right_ramp_standup_active: alamo_frenzy_scoring_hit
  s_left_orbit_enter_active: alamo_frenzy_scoring_hit
  s_right_orbit_exit_active: alamo_frenzy_scoring_hit
  s_left_inner_horseshoe_active: alamo_frenzy_scoring_hit
  s_left_spinner_active: alamo_frenzy_scoring_hit
