  s_left_pop_bumper_active: alamo_frenzy_scoring_hit
  s_right_pop_bumper_active: alamo_frenzy_scoring_hit

random_event_player:
  alamo_frenzy_widget_hit:
    events:
      - widget_alamo_can_widget_active
      - widget_alamo_can_widget2_active
      - widget_alamo_can_widget3_active
      - widget_alamo_can_widget4_active
      - widget_alamo_can_widget5_active
      - widget_alamo_can_widget6_active
      - widget_alamo_can_widget7_active
      - widget_alamo_can_widget8_active
  alamo_frenzy_hoo_yeah_hit:
    events:
      - play_peggy_ho_yeah_boggle_win_alamo
      - play_peggy_ho_yeah_boggle_championship_alamo
      - play_peggy_ho_yeah_leanne_fight_alamo
    force_different: true

counters:
  alamo_frenzy_hit_counter:
    count_events: alamo_frenzy_scoring_hit
    count_complete_value: 5
    reset_on_complete: true

light_player:
  mode_alamo_frenzy_started:
    l_p_target: FFA000
    l_r_target: FFA000
    l_o_target: FFA000
    l_p2_target: FFA000
    l_a_target: FFA000
    l_n_target: FFA000
    l_e_target: FFA000
    l_left_orbit: FFA000
    l_left_ramp: FFA000
    l_left_horseshoe: FFA000
    l_center_spinner: FFA000
    l_right_ramp: FFA000
    l_right_orbit: FFA000

show_player:
  mode_alamo_frenzy_started:
    alamo_frenzy_start:
      loops: 1
      priority: 510
  timer_alamo_frenzy_mode_countdown_tick{ticks == 5}:
    alamo_frenzy_hurry:
      key: alamo_hurry
      loops: -1
      priority: 520
  timer_alamo_frenzy_mode_countdown_complete:
    alamo_hurry: stop
    alamo_frenzy_six_pack:
      loops: 2
      priority: 530
      speed: 0.8
  logicblock_alamo_frenzy_hit_counter_complete:
    alamo_frenzy_six_pack:
      loops: 1
      priority: 530

  s_p_target_active:
    alamo_frenzy_shot_hit: {loops: 1, priority: 515, show_tokens: {light: l_p_target}}
  s_r_target_active:
    alamo_frenzy_shot_hit: {loops: 1, priority: 515, show_tokens: {light: l_r_target}}
  s_o_target_active:
    alamo_frenzy_shot_hit: {loops: 1, priority: 515, show_tokens: {light: l_o_target}}
  s_p2_target_active:
    alamo_frenzy_shot_hit: {loops: 1, priority: 515, show_tokens: {light: l_p2_target}}
