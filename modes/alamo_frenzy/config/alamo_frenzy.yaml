  widget_alamo_can_widget6_active:
    alamo_can_widget6:
      expire: 1s
  widget_alamo_can_widget7_active:
    alamo_can_widget7:
      expire: 1s
  widget_alamo_can_widget8_active:
    alamo_can_widget8:
      expire: 1s
  mode_alamo_frenzy_started: 
    alamo_can_widget:
      slide: alamo_frenzy_slide
    alamo_can_widget2:
      slide: alamo_frenzy_slide
    alamo_can_widget3:
      slide: alamo_frenzy_slide
  slide_alamo_frenzy_slide_active:
    alamo_can_widget4:
      slide: alamo_frenzy_slide
    alamo_can_widget5:
      slide: alamo_frenzy_slide
    alamo_can_widget6:
      slide: alamo_frenzy_slide
    alamo_can_widget7:
